{{- $agentImage := mergeOverwrite (deepCopy .Values.image) (default dict .Values.cellAgent.image) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cell-agent
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: cell-agent
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: cell-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: rest, port: 7001, targetPort: 7001}
    - {name: admin, port: 8082, targetPort: 8082}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cell-agent-api
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: cell-agent
spec:
  selector:
    app: cell-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: rest, port: 7001, targetPort: 7001}
{{- range $i, $_ := until (int .Values.cellAgent.replicas) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-cell-agent-{{ $i }}-endpoint
  labels:
    {{- include "cellhive.labels" $ | nindent 4 }}
    app: cell-agent
spec:
  # Peer recovery must reach a starting node before business readiness.
  publishNotReadyAddresses: true
  selector:
    app: cell-agent
    app.kubernetes.io/instance: {{ $.Release.Name }}
    statefulset.kubernetes.io/pod-name: {{ $.Release.Name }}-cell-agent-{{ $i }}
  ports:
    - {name: rest, port: 7001, targetPort: 7001}
    # Authenticated control requests forward to the owner admin listener.
    - {name: admin, port: 8082, targetPort: 8082}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-cell-agent
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: cell-agent
spec:
  serviceName: {{ .Release.Name }}-cell-agent
  replicas: {{ .Values.cellAgent.replicas }}
  # podManagementPolicy is immutable in Kubernetes and must stay Parallel.
  # OnDelete prevents Helm from replacing both cell-agents at once; the release
  # script deletes ordinals sequentially and waits for readiness.
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  selector:
    matchLabels:
      app: cell-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: cell-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.cellAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cellAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: cell-agent
          image: {{ include "cellhive.image" (dict "image" $agentImage) | quote }}
          imagePullPolicy: {{ $agentImage.pullPolicy }}
          command: ["cell-agent"]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
            - secretRef: {name: {{ include "cellhive.secretName" . }}}
          env:
            - name: CELLHIVE_AUTHORITY_MODE
              value: {{ .Values.cellAgent.authorityMode | default "legacy" | quote }}
            - name: CELLHIVE_AUTHORITY_RECLAIM_ACK
              value: {{ .Values.cellAgent.authorityReclaimACK | default "" | quote }}
            {{- with .Values.cellAgent.restoreParallel }}
            - name: CELLHIVE_RESTORE_PARALLEL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.proxysql.existingSecret }}
            - name: CELLHIVE_PROXYSQL_ADMIN
              valueFrom: {secretKeyRef: {name: {{ .Values.proxysql.existingSecret }}, key: CELLHIVE_PROXYSQL_ADMIN}}
            {{- else if .Values.proxysql.adminDsn }}
            - name: CELLHIVE_PROXYSQL_ADMIN
              value: {{ .Values.proxysql.adminDsn | quote }}
            {{- end }}
            {{- if .Values.telemetry.enabled }}
            - name: CELLHIVE_OTLP_ENDPOINT
              valueFrom: {secretKeyRef: {name: {{ include "cellhive.secretName" . }}, key: CELLHIVE_OTLP_ENDPOINT}}
            - name: CELLHIVE_OTLP_HEADERS
              valueFrom: {secretKeyRef: {name: {{ include "cellhive.secretName" . }}, key: CELLHIVE_OTLP_HEADERS, optional: true}}
            {{- end }}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: CELLHIVE_NODE_ID
              value: $(POD_NAME)
            # Stable Pod DNS, not the ephemeral Pod IP: owner records and
            # takeover recovery survive a StatefulSet restart with a new IP.
            - name: CELLHIVE_ADVERTISE
              value: $(POD_NAME)-endpoint.{{ .Release.Namespace }}.svc.cluster.local:7001
            - name: CELLHIVE_PEER_URL
              value: http://$(POD_NAME)-endpoint.{{ .Release.Namespace }}.svc.cluster.local:7001
          ports:
            - {name: rest, containerPort: 7001}
            - {name: admin, containerPort: 8082}
          startupProbe:
            # Recovery can take minutes; readiness still gates business traffic.
            httpGet: {path: /healthz, port: 7001}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 7001}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 7001}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.cellAgent.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: {{ .Values.cellAgent.storage }}}
