{{- if and (gt (int .Values.cellAgent.replicas) 1) (not (hasPrefix "s3://" (.Values.config.bucket | default ""))) -}}
{{- fail "cellAgent.replicas > 1 requires config.bucket=s3://... shared by all agents" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
data:
  CELLHIVE_CELL_URL: {{ printf "http://%s-cell-agent-0.%s-cell-agent.%s.svc.cluster.local:7001" .Release.Name .Release.Name .Release.Namespace | quote }}
  CELLHIVE_DATA_DIR: {{ .Values.config.dataDir | quote }}
  CELLHIVE_RUNTIME_DIR: {{ .Values.config.runtimeDir | quote }}
  CELLHIVE_WORKERD: "/usr/local/bin/workerd"
  CELLHIVE_USER_RUNTIME_JS: "/app/workerd/user-runtime"
  CELLHIVE_DO_RUNTIME_JS: "/app/workerd/do-runtime"
  CELLHIVE_FACADES_JS: "/app/workerd/platform/facades.js"
  CELLHIVE_TENANT_LOG_CAPTURE: {{ .Values.config.tenantLogCapture | quote }}
  CELLHIVE_REST_ADDR: ":7001"
  CELLHIVE_ADMIN_ADDR: ":8082"
  CELLHIVE_BUCKET_DIR: {{ .Values.config.bucketDir | quote }}
  CELLHIVE_USER_RUNTIME_PORT: "8081"
  CELLHIVE_USER_RUNTIME_INTERNAL_PORT: "8088"
  CELLHIVE_DO_ADDR: "*:8788"
  CELLHIVE_DO_RUNTIMES: {{ printf "%s:8788" (include "cellhive.doRuntimeService" .) | quote }}
  CELLHIVE_DISPATCH_URL: {{ printf "http://%s-user-runtime:8088" .Release.Name | quote }}
  CELLHIVE_POOL_MODE: {{ .Values.userRuntime.pool.mode | quote }}
  CELLHIVE_POOL_MEMORY_UTILIZATION: {{ .Values.userRuntime.pool.memoryUtilization | quote }}
  CELLHIVE_POOL_MAX_SLOTS: {{ .Values.userRuntime.pool.maxSlots | quote }}
  {{- if .Values.config.bucket }}
  CELLHIVE_BUCKET: {{ .Values.config.bucket | quote }}
  {{- end }}
