{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
type: Opaque
stringData:
  CELLHIVE_ROOT_KEY: {{ required "set rootKey or existingSecret (openssl rand -base64 32)" .Values.rootKey | quote }}
  {{- if .Values.config.awsEndpoint }}
  AWS_ACCESS_KEY_ID: {{ .Values.config.awsAccessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.config.awsSecretKey | quote }}
  {{- end }}
  {{- if .Values.config.ossEndpoint }}
  OSS_ACCESS_KEY_ID: {{ .Values.config.ossAccessKeyID | quote }}
  OSS_ACCESS_KEY_SECRET: {{ .Values.config.ossAccessKeySecret | quote }}
  {{- end }}
  {{- if .Values.config.cosEndpoint }}
  COS_SECRET_ID: {{ .Values.config.cosSecretID | quote }}
  COS_SECRET_KEY: {{ .Values.config.cosSecretKey | quote }}
  {{- end }}
{{- end }}
