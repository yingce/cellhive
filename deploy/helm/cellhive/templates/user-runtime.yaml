apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-user-runtime
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: user-runtime
spec:
  selector:
    app: user-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: public, port: 8081, targetPort: 8081}
    - {name: internal, port: 8088, targetPort: 8088}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-user-runtime
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: user-runtime
spec:
  replicas: {{ .Values.userRuntime.replicas }}
  selector:
    matchLabels:
      app: user-runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: user-runtime
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.runtimeHostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.userRuntime.dns.enabled }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          {{- toYaml .Values.userRuntime.dns.nameservers | nindent 10 }}
        {{- with .Values.userRuntime.dns.searches }}
        searches:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.userRuntime.dns.options }}
        options:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      # Prefer two user-runtime replicas on different nodes so one node loss
      # cannot take the public loader fully down. Preferred (not DoNotSchedule):
      # a small cluster can still schedule both rather than leave one pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: user-runtime
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: user-runtime
          image: {{ include "cellhive.image" (dict "image" .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["user-runtime"]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            {{- if .Values.telemetry.enabled }}
            - name: CELLHIVE_OTLP_ENDPOINT
              valueFrom: {secretKeyRef: {name: {{ include "cellhive.secretName" . }}, key: CELLHIVE_OTLP_ENDPOINT}}
            {{- end }}
            - name: CELLHIVE_ROOT_KEY
              valueFrom: {secretKeyRef: {name: {{ include "cellhive.secretName" . }}, key: CELLHIVE_ROOT_KEY}}
          ports:
            - {name: public, containerPort: 8081}
            - {name: internal, containerPort: 8088}
          startupProbe:
            tcpSocket: {port: 8081}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            # ADR-156: /ready reports projection availability and flips to 503
            # after POST /drain (the process drains itself on SIGTERM).
            httpGet: {path: /ready, port: 8081}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.userRuntime.resources | nindent 12 }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-user-runtime
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-user-runtime
  minReplicas: {{ .Values.userRuntime.minReplicas }}
  maxReplicas: {{ .Values.userRuntime.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.userRuntime.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.userRuntime.targetMemoryUtilizationPercentage }}
