apiVersion: v1
kind: Service
metadata:
  name: {{ include "cellhive.doRuntimeService" . }}
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: do-runtime
spec:
  selector:
    app: do-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: do, port: 8788, targetPort: 8788}
    {{- if .Values.doRuntime.gate }}
    - {name: gate, port: 18901, targetPort: 18901}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cellhive.doRuntimeService" . }}
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: do-runtime
spec:
  serviceName: {{ include "cellhive.doRuntimeService" . }}
  replicas: {{ if .Values.doRuntime.gate }}{{ .Values.doRuntime.replicas }}{{ else }}1{{ end }}
  {{- if .Values.doRuntime.gate }}
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  updateStrategy: {type: OnDelete}
  {{- end }}
  selector:
    matchLabels:
      app: do-runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: do-runtime
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: do-runtime
          image: {{ include "cellhive.image" (dict "image" .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.doRuntime.gate }}
          # ADR-083/140: do-supervisor renders, spawns workerd and gates every
          # response on cell-agent durability; it also owns lease renew/drain.
          command: ["/usr/local/bin/do-runtime-gated.sh"]
          {{- else }}
          command: ["/usr/local/bin/do-runtime"]
          {{- end }}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          env:
            - name: CELLHIVE_ROOT_KEY
              valueFrom: {secretKeyRef: {name: {{ include "cellhive.secretName" . }}, key: CELLHIVE_ROOT_KEY}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: CELLHIVE_DO_NODE
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: CELLHIVE_DO_ADVERTISE
              value: $(POD_IP):8788
            {{- if .Values.doRuntime.gate }}
            - name: CELLHIVE_DO_GATE_LISTEN
              value: ":18901"
            {{- end }}
          ports:
            - {name: do, containerPort: 8788}
            {{- if .Values.doRuntime.gate }}
            - {name: gate, containerPort: 18901}
            {{- end }}
          readinessProbe:
            # ADR-156: 503 while draining or while cell-agent is unreachable.
            httpGet: {path: /ready, port: 8788}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 8788}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.doRuntime.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.doRuntime.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.doRuntime.storage }}
