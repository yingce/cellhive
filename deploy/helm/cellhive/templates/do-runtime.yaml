apiVersion: v1
kind: Service
metadata:
  name: {{ include "cellhive.doRuntimeService" . }}
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: do-runtime
spec:
  clusterIP: None
  selector:
    app: do-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: do, port: 8788, targetPort: 8788}
    {{- if .Values.doRuntime.gate }}
    - {name: gate, port: 18901, targetPort: 18901}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cellhive.doRuntimeService" . }}
  labels:
    {{- include "cellhive.labels" . | nindent 4 }}
    app: do-runtime
spec:
  replicas: {{ .Values.doRuntime.replicas }}
  selector:
    matchLabels:
      app: do-runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: do-runtime
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: do-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.doRuntime.gate }}
          # ADR-083/140: do-supervisor renders, spawns workerd and gates every
          # response on cell-agent durability; it also owns lease renew/drain.
          command: ["do-runtime-gated"]
          {{- else }}
          command: ["do-runtime"]
          {{- end }}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
            - secretRef: {name: {{ include "cellhive.secretName" . }}}
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: CELLHIVE_DO_NODE
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: CELLHIVE_DO_ADVERTISE
              value: $(POD_IP):8788
            {{- if .Values.doRuntime.gate }}
            - name: CELLHIVE_DO_GATE_LISTEN
              value: ":18901"
            {{- end }}
          ports:
            - {name: do, containerPort: 8788}
            {{- if .Values.doRuntime.gate }}
            - {name: gate, containerPort: 18901}
            {{- end }}
          readinessProbe:
            # ADR-156: 503 while draining or while cell-agent is unreachable.
            httpGet: {path: /ready, port: 8788}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 8788}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.doRuntime.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
