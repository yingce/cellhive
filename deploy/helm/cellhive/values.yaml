# CellHive Helm values. Single node uses its PVC as the authoritative filesystem
# bucket. Multiple cell-agent replicas require a shared externally managed S3.

image:
  repository: cellhive
  tag: dev
  # Prefer a digest for production. When empty, tag is used for local/dev use.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Provide the platform root key either inline (rootKey) or via a pre-created
# Secret (existingSecret with key CELLHIVE_ROOT_KEY). Secrets should not be
# committed: prefer existingSecret or --set-file. A mounted file works too: add
# the volume yourself and set CELLHIVE_ROOT_KEY_FILE (ADR-150).
rootKey: ""
existingSecret: ""

telemetry:
  # Enable OTLP traces using CELLHIVE_OTLP_ENDPOINT from existingSecret.
  # Keep credential-bearing collector URLs out of values and ConfigMaps.
  enabled: false
  tracesSampleRatio: "0.01"
  # ARMS traces endpoints do not accept OTLP logs; use a logs-capable backend.
  logs: "off"

# Optional ProxySQL admin reconciliation. Prefer existingSecret with key
# CELLHIVE_PROXYSQL_ADMIN; adminDsn is for local/dev only.
proxysql:
  # One DSN per ProxySQL replica, comma-separated for fanout.
  adminDsn: ""
  existingSecret: ""
  save: false

hyperdrive:
  # direct: inject the origin connectionString (default, no pooler needed).
  # proxy: rewrite host/port to the protocol pooler; database/user/password/query kept.
  mode: direct
  # Create a per-binding origin role; the origin URL must be able to
  # CREATE USER/GRANT. Workers receive only the generated client credentials.
  managedUsers: false
  # Pooler endpoint(s). A bare host:port is PostgreSQL; use scheme URLs for
  # both protocols, e.g. postgres://proxysql:6133,mysql://proxysql:6033.
  proxy: ""
  # origin: keep origin database name; binding: hd_<resource> for PostgreSQL
  # poolers that map the database name.
  dbMode: origin


config:
  dataDir: /data/state
  runtimeDir: /data/runtime
  bucketDir: /data/bucket
  # Set off for throughput-first runtimes that do not need platform capture of
  # tenant console output and uncaught exceptions.
  tenantLogCapture: "on"
  tenantOutbound: "public,private,local"
  # Multiple cell-agent replicas require a shared bucket. Supported schemes:
  # s3://, oss://, cos://. Put endpoint and credentials below or in existingSecret.
  bucket: s3://cellhive
  awsEndpoint: ""
  awsRegion: us-east-1
  awsAccessKey: ""
  awsSecretKey: ""
  ossEndpoint: ""
  ossAccessKeyID: ""
  ossAccessKeySecret: ""
  cosEndpoint: ""
  cosSecretID: ""
  cosSecretKey: ""

cellAgent:
  # Optional image fields merged over global image for agent-first upgrades.
  image: {}
  replicas: 2
  storage: 20Gi
  # Bound cached SQLite cell handles and close idle handles. 0 disables
  # the respective cap/TTL; lower these when the container memory is tight.
  maxOpenCells: 32
  cellIdle: 5m
  # Use paged cold restore for SQLite images at or above this size.
  pagedMinBytes: 32MiB
  # Byte budget for one paged readahead window; converted with pageSize.
  pagedReadAheadBytes: 1MiB
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 2Gi}

userRuntime:
  replicas: 2
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
  pool:
    # opt-in only: adaptive mode starts Go-managed workerd slots behind the
    # user-runtime ports; default keeps the proven single workerd path.
    mode: ""
    memoryUtilization: 0.70
    maxSlots: 16
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    # Container-wide quota, including Go host and workerd. CPU throttles usage;
    # this is not an invocation CPU timer or a per-isolate memory limit.
    limits: {cpu: "1", memory: 2Gi}

doRuntime:
  # Set false when this installation has no Durable Object workloads.
  enabled: true
  replicas: 2
  # gate=true deploys do-runtime-gated (ADR-083/140: DO RPO=0 via the output
  # gate); false deploys the ungated runtime.
  gate: true
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    # Gated runtime shares this budget with its supervisor and WAL capture.
    limits: {cpu: "2", memory: 4Gi}
  storage: 20Gi
  storageClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Extra ingress sources for the admin port (8082), e.g. the ingress
  # controller's namespace when the edge runs outside this release:
  #   adminIngressFrom:
  #     - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress}}
  adminIngressFrom: []

ingress:
  enabled: false
  className: ""
  host: ""            # e.g. cellhive.example.com (admin/API host)
  publicHost: ""       # optional public static/Worker host
  tlsSecret: ""       # optional TLS secret name
  annotations: {}
