apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DO RPO=0 overlay: replace the ungated do-runtime with the gated one
# (ADR-083) and point cell-agent placement at it.
resources:
  - ../../base
  - do-runtime-gated.yaml

patches:
  - target: {kind: ConfigMap, name: cellhive-config}
    patch: |-
      - op: replace
        path: /data/CELLHIVE_DO_RUNTIMES
        value: do-runtime-gated:8788
  - target: {kind: Deployment, name: do-runtime}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
