# cell-agent is a StatefulSet: it has a stable identity (owner/handoff key) and
# owns the local SQLite working directory. Run >=2 replicas for HA; the headless
# Service returns pod IPs so peers and runtimes can reach it directly.
apiVersion: v1
kind: Service
metadata:
  name: cell-agent
  namespace: cellhive
  labels: {app: cell-agent, app.kubernetes.io/part-of: cellhive}
spec:
  clusterIP: None
  selector: {app: cell-agent}
  ports:
    - {name: rest, port: 7001, targetPort: 7001}
    - {name: admin, port: 8082, targetPort: 8082}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cell-agent
  namespace: cellhive
  labels: {app: cell-agent, app.kubernetes.io/part-of: cellhive}
spec:
  serviceName: cell-agent
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: cell-agent}
  template:
    metadata:
      labels: {app: cell-agent}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      serviceAccountName: cellhive
      terminationGracePeriodSeconds: 120
      containers:
        - name: cell-agent
          image: cellhive:dev # replace with your registry image
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/cell-agent"]
          envFrom:
            - configMapRef: {name: cellhive-config}
            - secretRef: {name: cellhive-secrets}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: CELLHIVE_NODE_ID
              value: $(POD_NAME)
            - name: CELLHIVE_ADVERTISE
              value: $(POD_IP):7001
          ports:
            - {name: rest, containerPort: 7001}
            - {name: admin, containerPort: 8082}
          startupProbe:
            httpGet: {path: /readyz, port: 7001}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 7001}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 7001}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 20Gi}
