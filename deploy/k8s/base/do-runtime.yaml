# The ClusterIP Service load-balances arbitrary first hops. Each Pod advertises
# its own Pod IP in the DO owner record so non-owners reach the actual owner.
apiVersion: v1
kind: Service
metadata:
  name: do-runtime
  namespace: cellhive
  labels: {app: do-runtime, app.kubernetes.io/part-of: cellhive}
spec:
  selector: {app: do-runtime}
  ports:
    - {name: do, port: 8788, targetPort: 8788}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: do-runtime
  namespace: cellhive
  labels: {app: do-runtime, app.kubernetes.io/part-of: cellhive}
spec:
  serviceName: do-runtime
  replicas: 1
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels: {app: do-runtime}
  template:
    metadata:
      labels: {app: do-runtime}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      serviceAccountName: cellhive
      terminationGracePeriodSeconds: 60
      containers:
        - name: do-runtime
          image: cellhive:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/do-runtime"]
          envFrom:
            - configMapRef: {name: cellhive-config}
          env:
            - name: CELLHIVE_ROOT_KEY
              valueFrom: {secretKeyRef: {name: cellhive-secrets, key: CELLHIVE_ROOT_KEY}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: CELLHIVE_DO_NODE
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: CELLHIVE_DO_ADVERTISE
              value: $(POD_IP):8788
          ports:
            - {name: do, containerPort: 8788}
          startupProbe:
            tcpSocket: {port: 8788}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            # ADR-156: 503 while draining or while cell-agent is unreachable.
            httpGet: {path: /ready, port: 8788}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 8788}
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 20Gi}
