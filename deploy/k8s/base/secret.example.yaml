# EXAMPLE ONLY — do not commit real secrets. Create the Secret with kubectl:
#
#   kubectl -n cellhive create secret generic cellhive-secrets \
#     --from-literal=CELLHIVE_ROOT_KEY="$(openssl rand -base64 32)"
#
# Alternatively mount a secret file and set CELLHIVE_ROOT_KEY_FILE instead of
# this Secret (Docker/K8s *_FILE convention, ADR-150).
#
# Store AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in this Secret and set
# CELLHIVE_BUCKET=s3://<bucket>, AWS_ENDPOINT_URL and AWS_REGION on cell-agent
# only; runtime pods receive only the root key, never bucket credentials.
apiVersion: v1
kind: Secret
metadata:
  name: cellhive-secrets
  namespace: cellhive
type: Opaque
stringData:
  CELLHIVE_ROOT_KEY: "REPLACE_ME_openssl_rand_base64_32"
