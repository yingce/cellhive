# CellHive local stack: cell-agent + user-runtime + do-runtime on one image.
#
#   export CELLHIVE_ROOT_KEY=$(openssl rand -base64 32)
#   docker compose -f deploy/compose/docker-compose.yml up --build -d
#
# The edge (Traefik/ingress) is opt-in via the "edge" profile: the platform does
# not push edge config (ADR-132), so routing is configured by the operator.
name: cellhive

x-image: &image
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
    additional_contexts:
      workerd-fork: ${CELLHIVE_WORKERD_FORK_CONTEXT:-../workerd-fork}
  image: cellhive:dev
  restart: unless-stopped

x-common-env: &common-env
  CELLHIVE_ROOT_KEY: ${CELLHIVE_ROOT_KEY:?set CELLHIVE_ROOT_KEY (openssl rand -base64 32)}
  CELLHIVE_CELL_URL: http://cell-agent:7001
  CELLHIVE_WORKERD: /usr/local/bin/workerd
  CELLHIVE_RUNTIME_DIR: /data/runtime
  # OTLP tracing is off unless CELLHIVE_OTLP_ENDPOINT is set (ADR-167).
  CELLHIVE_OTLP_ENDPOINT: ${CELLHIVE_OTLP_ENDPOINT:-}
  CELLHIVE_OTLP_HEADERS: ${CELLHIVE_OTLP_HEADERS:-}
  CELLHIVE_TRACES_SAMPLE_RATIO: ${CELLHIVE_TRACES_SAMPLE_RATIO:-0.01}
  CELLHIVE_TENANT_LOG_CAPTURE: ${CELLHIVE_TENANT_LOG_CAPTURE:-on}
  CELLHIVE_POOL_MODE: ${CELLHIVE_POOL_MODE:-}
  CELLHIVE_POOL_MEMORY_UTILIZATION: ${CELLHIVE_POOL_MEMORY_UTILIZATION:-0.70}
  CELLHIVE_POOL_MAX_SLOTS: ${CELLHIVE_POOL_MAX_SLOTS:-16}
  # Hyperdrive default is direct origin; set CELLHIVE_HYPERDRIVE_MODE=proxy
  # and CELLHIVE_HYPERDRIVE_PROXY to route through an external pooler.
  # Bound cached cell handles so a long-lived node cannot grow its SQLite
  # handle/page-cache working set without limit (0 disables the cap).
  CELLHIVE_MAX_OPEN_CELLS: ${CELLHIVE_MAX_OPEN_CELLS:-32}
  CELLHIVE_CELL_IDLE: ${CELLHIVE_CELL_IDLE:-5m}
  CELLHIVE_PAGED_MIN_BYTES: ${CELLHIVE_PAGED_MIN_BYTES:-32MiB}
  CELLHIVE_HYPERDRIVE_MODE: ${CELLHIVE_HYPERDRIVE_MODE:-direct}
  # Create a per-binding origin role so workers never receive the origin
  # user/password. The sealed origin URL must have CREATE USER/GRANT rights.
  CELLHIVE_HYPERDRIVE_MANAGED_USERS: ${CELLHIVE_HYPERDRIVE_MANAGED_USERS:-0}
  # Bare host:port = PostgreSQL; use postgres://... or mysql://... entries
  # (comma-separated) to carry both protocols through one variable.
  CELLHIVE_HYPERDRIVE_PROXY: ${CELLHIVE_HYPERDRIVE_PROXY:-}
  # Optional ProxySQL admin DSN; when set, Hyperdrive resource create/delete
  # upserts/removes mysql_* or pgsql_* rows and LOADs them into RUNTIME.
  CELLHIVE_PROXYSQL_ADMIN: ${CELLHIVE_PROXYSQL_ADMIN:-}
  CELLHIVE_PROXYSQL_SAVE: ${CELLHIVE_PROXYSQL_SAVE:-0}
  CELLHIVE_HYPERDRIVE_DB_MODE: ${CELLHIVE_HYPERDRIVE_DB_MODE:-origin}

services:
  cell-agent:
    <<: *image
    command: ["cell-agent"]
    environment:
      <<: *common-env
      CELLHIVE_NODE_ID: cell-agent-a
      CELLHIVE_ADVERTISE: cell-agent:7001
      CELLHIVE_REST_ADDR: ":7001"
      CELLHIVE_ADMIN_ADDR: ":8082"
      CELLHIVE_DATA_DIR: /data/state
      CELLHIVE_BUCKET_DIR: /data/bucket
      # Only cell-agent receives long-lived bucket credentials.
      CELLHIVE_BUCKET: ${CELLHIVE_BUCKET:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # The rpo0 profile places only on gated do-runtime.
      CELLHIVE_DO_RUNTIMES: ${CELLHIVE_DO_RUNTIMES:-do-runtime:8788}
      # The queue/timer/cron/waker loops POST due work to user-runtime's internal
      # privileged endpoint; without this they silently never dispatch.
      CELLHIVE_DISPATCH_URL: http://user-runtime:8088
    expose: ["7001", "8082"]
    volumes:
      - cell-agent-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7001/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  user-runtime:
    <<: *image
    cpus: ${CELLHIVE_USER_RUNTIME_CPUS:-1.0}
    mem_limit: ${CELLHIVE_USER_RUNTIME_MEMORY:-2g}
    memswap_limit: ${CELLHIVE_USER_RUNTIME_MEMORY:-2g}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    command: ["user-runtime"]
    environment:
      <<: *common-env
      CELLHIVE_USER_RUNTIME_PORT: "8081"
      CELLHIVE_USER_RUNTIME_INTERNAL_PORT: "8088"
      CELLHIVE_USER_RUNTIME_JS: /app/workerd/user-runtime
      CELLHIVE_FACADES_JS: /app/workerd/platform/facades.js
      # Tail log registration URL must be reachable from cell-agent; 127.0.0.1
      # is the runtime's own container, not the agent.
      CELLHIVE_USER_RUNTIME_ADVERTISE: ${CELLHIVE_USER_RUNTIME_ADVERTISE:-user-runtime}
    expose: ["8081", "8088"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - user-runtime-data:/data
    depends_on:
      cell-agent:
        condition: service_healthy

  do-runtime:
    <<: *image
    cpus: ${CELLHIVE_DO_RUNTIME_CPUS:-2.0}
    mem_limit: ${CELLHIVE_DO_RUNTIME_MEMORY:-4g}
    memswap_limit: ${CELLHIVE_DO_RUNTIME_MEMORY:-4g}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    command: ["do-runtime"]
    environment:
      <<: *common-env
      CELLHIVE_DO_ADDR: "*:8788"
      CELLHIVE_DO_NODE: do-runtime-1
      CELLHIVE_DO_ADVERTISE: do-runtime:8788
      CELLHIVE_DO_RUNTIME_JS: /app/workerd/do-runtime
      CELLHIVE_DATA_DIR: /data/state
    expose: ["8788"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - do-runtime-data:/data
    depends_on:
      cell-agent:
        condition: service_healthy

  # DO with the ADR-083 output gate (RPO=0), profile "rpo0": do-supervisor spawns
  # workerd and gates responses on cell-agent durability. Use this instead of
  # do-runtime in production.
  do-runtime-gated:
    <<: *image
    cpus: ${CELLHIVE_DO_RUNTIME_CPUS:-2.0}
    mem_limit: ${CELLHIVE_DO_RUNTIME_MEMORY:-4g}
    memswap_limit: ${CELLHIVE_DO_RUNTIME_MEMORY:-4g}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    command: ["do-runtime-gated"]
    profiles: ["rpo0"]
    environment:
      <<: *common-env
      CELLHIVE_DO_ADDR: "*:8788"
      CELLHIVE_DO_NODE: do-runtime-gated-1
      CELLHIVE_DO_ADVERTISE: do-runtime-gated:8788
      CELLHIVE_DO_RUNTIME_JS: /app/workerd/do-runtime
      CELLHIVE_DATA_DIR: /data/state
      CELLHIVE_DO_GATE_LISTEN: ":18901"
    expose: ["8788", "18901"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - gated-runtime-data:/data
    depends_on:
      cell-agent:
        condition: service_healthy

  # Optional local S3 endpoint; create its bucket before starting cell-agent.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    profiles: ["s3"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

  # Optional OTLP trace backend (profile "tracing", ADR-167). Point CellHive at
  # it with CELLHIVE_OTLP_ENDPOINT=http://openobserve:5080/api/default and
  # CELLHIVE_OTLP_HEADERS="authorization=Basic $(printf %s 'root@example.com:Complexpass#123' | base64)".
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    profiles: ["tracing"]
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
    ports: ["5080:5080"]
    volumes:
      - openobserve-data:/data

  # OTLP Collector (profile "observability"): redaction / namespace routing /
  # tail sampling in front of a backend. Point CellHive at it with
  #   CELLHIVE_OTLP_ENDPOINT=http://otel-collector:4318
  #   CELLHIVE_OTLP_HEADERS=authorization=Bearer <internal-token>   # optional
  # and set OPENOBSERVE_BASIC_AUTH (base64 of user:pass) for the backend hop.
  # See deploy/observability/README.md for the multi-tenant model.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OPENOBSERVE_BASIC_AUTH: ${OPENOBSERVE_BASIC_AUTH:-}
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [openobserve]

  # Ops-provided edge; the platform does not push its config (ADR-132).
  edge:
    image: traefik:v3
    profiles: ["edge"]
    ports: ["80:80", "443:443"]
    depends_on: [user-runtime]

volumes:
  cell-agent-data:
  user-runtime-data:
  do-runtime-data:
  gated-runtime-data:
  minio-data:
  openobserve-data:
