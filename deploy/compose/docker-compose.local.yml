# Local workstation overlay: publish the user-runtime public port and the
# cell-agent admin port. Base stack intentionally only `expose`s them for an
# operator-provided edge.
services:
  user-runtime:
    ports:
      - "${CELLHIVE_LOCAL_HTTP_PORT:-8081}:8081"
  cell-agent:
    ports:
      - "127.0.0.1:${CELLHIVE_LOCAL_ADMIN_PORT:-8082}:8082"
