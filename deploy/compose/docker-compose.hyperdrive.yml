# Local Hyperdrive profile: MySQL origin + ProxySQL 3. CellHive automatically
# provisions the per-binding origin role and ProxySQL backend/user when a
# Hyperdrive resource is created (CELLHIVE_HYPERDRIVE_MANAGED_USERS=1).
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     -f docker-compose.hyperdrive.yml --profile hyperdrive up -d
services:
  mysql:
    image: mysql:8.0
    profiles: ["hyperdrive"]
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: [mysql-data:/var/lib/mysql]

  proxysql:
    image: proxysql/proxysql:3.0.11
    profiles: ["hyperdrive"]
    depends_on:
      mysql:
        condition: service_healthy
    expose: ["6032", "6033", "6133"]

  # The default ProxySQL admin user is localhost-only. Create a secondary
  # admin user so cell-agent can reconcile from another container. cell-agent's
  # 30s reconcile retries if this one-shot init runs after startup.
  proxysql-init:
    image: proxysql/proxysql:3.0.11
    profiles: ["hyperdrive"]
    depends_on: [proxysql]
    network_mode: "service:proxysql"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 1 40); do mysql -h 127.0.0.1 -P6032 -uadmin -padmin -N -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 1; done; mysql -h 127.0.0.1 -P6032 -uadmin -padmin -e "UPDATE global_variables SET variable_value='admin:admin;cellhive:cellhive' WHERE variable_name='admin-admin_credentials'; LOAD ADMIN VARIABLES TO RUNTIME; SAVE ADMIN VARIABLES TO DISK; PROXYSQL RESTART;" || true
    restart: "no"

  user-runtime:
    environment:
      # tenant must reach the private Docker network for mysql:///postgres://
      CELLHIVE_TENANT_OUTBOUND: "public,private,local"

  cell-agent:
    environment:
      CELLHIVE_HYPERDRIVE_MODE: proxy
      CELLHIVE_HYPERDRIVE_PROXY: "postgres://proxysql:6133,mysql://proxysql:6033"
      CELLHIVE_PROXYSQL_ADMIN: "cellhive:cellhive@tcp(proxysql:6032)/"
      CELLHIVE_HYPERDRIVE_MANAGED_USERS: "1"

volumes:
  mysql-data:
