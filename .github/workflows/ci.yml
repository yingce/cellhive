name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: test -z "$(gofmt -l .)"
      - run: make vet
      - name: Run make test
        id: go-tests
        shell: bash
        run: make test 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Annotate Go test failures
        if: failure() && steps.go-tests.outcome == 'failure'
        shell: python
        run: |
          import os, pathlib, re
          lines = pathlib.Path(os.environ["RUNNER_TEMP"], "go-test.log").read_text().splitlines()
          failures = [line for line in lines if re.search(r"^--- FAIL:|^FAIL(?:\s|$)|^\s+\S+\.go:\d+:|^panic:|^fatal error:", line)]
          for line in (failures or lines[-30:])[:100]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Go test failure::{escaped}")
      - run: make build
      - run: make perf-test
      - run: make rpo-test

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pin the platform workerd; js-test skips cleanly if it is absent.
      - run: npm i -g @cloudflare/workerd-linux-64@1.20260916.1
      - run: ln -sf "$(npm root -g)/@cloudflare/workerd-linux-64/bin/workerd" /usr/local/bin/workerd
      - run: workerd --version
      - run: make js-test

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd cli && bun install --frozen-lockfile
      - run: make cli-test

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The runtime image embeds the cellhive-workerd fork. Build that artifact
      # in the release pipeline; this job validates the orchestration files.
      - run: make compose-config
      - run: make k8s-render
      - uses: azure/setup-helm@v4
      - run: make helm-lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @cloudflare/workerd-linux-64@1.20260916.1
      - run: ln -sf "$(npm root -g)/@cloudflare/workerd-linux-64/bin/workerd" /usr/local/bin/workerd
      - run: make build
      - run: make e2e
        env:
          CELLHIVE_WORKERD: /usr/local/bin/workerd

  e2e-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @cloudflare/workerd-linux-64@1.20260916.1
      - run: ln -sf "$(npm root -g)/@cloudflare/workerd-linux-64/bin/workerd" /usr/local/bin/workerd
      - run: make build
      - run: make e2e-mysql
        env:
          CELLHIVE_WORKERD: /usr/local/bin/workerd
