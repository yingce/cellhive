<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#020617"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <text x="56" y="62" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700">CellHive · cellhive-workerd fork</text>
  <text x="56" y="88" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">Go cell/state plane + workerd fork compute plane · RPO=0 cells</text>

  <!-- edge -->
  <rect x="56" y="130" width="1088" height="58" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="164" text-anchor="middle" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12">Edge / Traefik · TLS + host routing (operator-owned, static)</text>

  <!-- runtimes -->
  <rect x="56" y="230" width="510" height="150" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="260" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">user-runtime</text>
  <text x="76" y="284" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="11">CellHive workerd fork</text>
  <text x="76" y="306" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">:8081 public · :8088 internal dispatch</text>
  <text x="76" y="328" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">workerLoader · queue/scheduled · static generations</text>
  <text x="76" y="350" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">per-invocation CPU / subrequest / deadline limits</text>

  <rect x="590" y="230" width="554" height="150" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="610" y="260" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">do-runtime</text>
  <text x="610" y="284" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="11">CellHive workerd fork + Go supervisor</text>
  <text x="610" y="306" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">:8788 · native Durable Objects / facets</text>
  <text x="610" y="328" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">output gate · WAL capture · elastic nodes</text>

  <!-- agent -->
  <rect x="56" y="430" width="700" height="120" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="76" y="460" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">cell-agent (Go, fixed cluster)</text>
  <text x="76" y="484" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="10">:7001 internal REST/data · :8082 admin</text>
  <text x="76" y="506" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">cells · SQLite · LTX · owner/epoch · timers · dispatch</text>
  <text x="76" y="528" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">only component holding object-store credentials</text>

  <!-- object store + proxysql -->
  <rect x="790" y="430" width="354" height="120" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="810" y="460" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">S3-compatible object store</text>
  <text x="810" y="484" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="10">authority: cells · bundles · assets</text>
  <text x="810" y="506" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">conditional write elects owner</text>

  <rect x="56" y="590" width="1088" height="68" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="76" y="618" fill="#fb7185" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">Optional shared data plane</text>
  <text x="76" y="642" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="10">ProxySQL 3 · postgres://:6133 · mysql://:6033 · managed hd_* origin roles · MySQL/PostgreSQL Hyperdrive</text>

  <!-- arrows -->
  <line x1="600" y1="188" x2="311" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="188" x2="867" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="311" y1="380" x2="311" y2="430" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="867" y1="380" x2="867" y2="430" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="550" x2="790" y2="490" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="658" x2="600" y2="590" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="76" y="700" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="9">workerd fork: github.com/yingce/cellhive-workerd · pinned cellhive-v1.20260916.1-3</text>
</svg>
